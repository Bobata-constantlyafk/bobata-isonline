name: Publish rebuild

# Triggered by worker/rebuild.ts via GitHub's API whenever an admin save
# publishes/edits/deletes content in D1. There's nothing to build here —
# Cloudflare Workers Builds is already connected to this repo and rebuilds
# on every push to master, reading fresh content from D1 via
# scripts/fetch-articles-from-d1.mjs. This job's only job is to produce a
# push for that pipeline to react to.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push empty commit to trigger Cloudflare build
        run: |
          git config user.name "bobata-rebuild-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "chore: rebuild (admin publish)"
          git push
